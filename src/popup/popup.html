<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../shared.css" />
    <link rel="stylesheet" href="popup.css" />
    <title>Tab Cleanup</title>
  </head>
  <body>
    <main>
      <header>
        <h1>Tab Cleanup</h1>
      </header>

      <div id="scan-slot">
        <button id="scan" class="primary" type="button">Scan my tabs</button>
        <button id="vacuum" class="danger-solid" type="button">Vacuum 'em all!</button>
      </div>

      <p id="status" class="muted status"></p>

      <!-- What Vacuum is about to close, listed while the button is armed.
           CLAUDE.md rule 2: the confirm names its targets, never just counts. -->
      <ul id="vacuum-list" class="hidden detail-list"></ul>

      <section id="results" class="hidden">
        <p id="totals" class="muted"></p>

        <div class="result-block">
          <div class="result-head">
            <span>Unused new tabs</span>
            <span id="new-tab-count" class="count">0</span>
          </div>
          <p id="new-tab-windows" class="muted small"></p>
          <button id="toggle-protected" class="link hidden" type="button"></button>
          <ul id="protected-list" class="hidden detail-list"></ul>
        </div>

        <div class="result-block">
          <div class="result-head">
            <span>System tabs</span>
            <span id="system-tab-count" class="count">0</span>
          </div>
          <p id="system-tab-summary" class="muted small"></p>
        </div>

        <div class="result-block">
          <div class="result-head">
            <span>Duplicates</span>
            <span id="duplicate-count" class="count">0</span>
          </div>
          <p id="duplicate-summary" class="muted small"></p>
        </div>

        <div class="action-buttons">
          <button id="open-review" class="primary hidden" type="button">Review &amp; clean →</button>
          <button id="copy" type="button" title="Copy the scan as markdown" class="secondary">⧉ Copy report</button>
        </div>

        <footer>
          <span class="muted small"><u>Nothing is closed nor deleted without your confirmation.</u></span>
        </footer>
      </section>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
